[package]
name = "sysghost"
version = "0.1.0"
edition = "2024"
authors = ["0xnullroot"]
description = "Lightweight Linux runtime monitoring and process intelligence, built with Rust."
repository = "https://github.com/0xnullroot/SysGhost"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["param"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
